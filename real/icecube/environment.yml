name: inf-icecube
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - scipy
  - matplotlib
  - astropy
  - h5py
  - corner
  - getdist
  - joblib
  - ultranest
  - pymultinest
  - dynesty
  - nestle
  - numba
  - pandas
  - iminuit
  - nlopt
  - pytables
  - uncertainties
  - sympy
  - cython
  - pip
  - pip:
      - emcee==3.1.6
      - git+https://github.com/icecube/pisa
      - snowline
      - autoemcee
